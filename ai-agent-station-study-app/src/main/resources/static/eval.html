<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvalOps · TAgent</title>
  <style>
    :root{--bg:#071018;--panel:#0d1722;--panel2:#111e2b;--line:#203246;--text:#e8f0f8;--muted:#8192a6;--blue:#4f8cff;--cyan:#37d6c5;--green:#49d17d;--yellow:#f6c85f;--red:#ff6b78;--purple:#9c7cff}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 75% -20%,#143457 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:20px;background:#08121dcc;backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
    .brand{font-size:18px;font-weight:800;letter-spacing:.2px}.brand span{color:var(--cyan)}.topbar .sub{color:var(--muted);font-size:12px}.spacer{flex:1}
    .btn{border:1px solid var(--line);background:#122131;color:var(--text);padding:8px 13px;border-radius:9px;transition:.16s}.btn:hover{border-color:#3b5d80;background:#162a3d}.btn.primary{background:linear-gradient(135deg,#4f8cff,#6b6cff);border:0}.btn.good{background:#153b2a;border-color:#286b4a;color:#94f5b9}.btn.danger{color:#ffabb2}.btn.small{padding:5px 9px;font-size:12px}
    .tabs{display:flex;gap:4px;background:#0c1824;border:1px solid var(--line);padding:3px;border-radius:10px}.tab{border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:7px}.tab.active{background:#203247;color:#fff}
    .layout{display:grid;grid-template-columns:310px minmax(0,1fr);height:calc(100vh - 64px)}.sidebar{border-right:1px solid var(--line);padding:18px;overflow:auto;background:#09131d99}.content{padding:24px;overflow:auto}
    .side-head{display:flex;align-items:center;margin-bottom:12px}.side-head h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#9cafc2}.side-list{display:flex;flex-direction:column;gap:8px}
    .side-item{padding:12px;border:1px solid transparent;border-radius:11px;background:#0d1925;cursor:pointer}.side-item:hover,.side-item.active{border-color:#315170;background:#122233}.side-title{display:flex;align-items:center;gap:8px;font-weight:650}.side-meta{color:var(--muted);font-size:12px;margin-top:5px;display:flex;justify-content:space-between}
    .badge{display:inline-flex;align-items:center;border:1px solid #31465c;background:#152334;color:#a9bfd5;border-radius:99px;padding:2px 7px;font-size:11px;white-space:nowrap}.badge.green{border-color:#246044;background:#123423;color:#7ce9a5}.badge.yellow{border-color:#705c2b;background:#342b14;color:#f4cd70}.badge.red{border-color:#70343b;background:#35191d;color:#ff9ca6}.badge.blue{border-color:#315b8c;background:#142d49;color:#8bbcff}.badge.purple{border-color:#55458b;background:#241d48;color:#b9a7ff}
    .empty{border:1px dashed #2a3d51;border-radius:14px;padding:42px;text-align:center;color:var(--muted)}
    .hero{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}.hero h1{font-size:25px;margin:0 0 5px}.hero p{color:var(--muted);margin:0}.hero-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
    .grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,minmax(130px,1fr));margin-bottom:18px}.card{background:linear-gradient(160deg,#0e1b28,#0b1621);border:1px solid var(--line);border-radius:14px;padding:16px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:26px;font-weight:750;margin-top:3px}.stat-note{font-size:11px;color:var(--muted);margin-top:2px}
    .section{margin-top:18px}.section-head{display:flex;align-items:center;margin-bottom:10px}.section-head h2{margin:0;font-size:16px}.section-head .hint{color:var(--muted);font-size:12px;margin-left:10px}.section-head .actions{margin-left:auto;display:flex;gap:8px}
    table{width:100%;border-collapse:separate;border-spacing:0;background:#0d1924;border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #1b2c3e;vertical-align:top}th{font-size:11px;color:#8fa3b8;text-transform:uppercase;letter-spacing:.5px;background:#101e2c;position:sticky;top:0}th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:#d7e8f8;background:#16283a}tr:last-child td{border-bottom:0}tbody tr:hover{background:#122234}.truncate{max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num{font-variant-numeric:tabular-nums}.link{color:#8bbcff;cursor:pointer}.muted{color:var(--muted)}
    .progress{height:8px;background:#172738;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:inherit;transition:width .3s}
    .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{display:grid;grid-template-columns:94px 1fr 42px;align-items:center;gap:8px}.metric .bar{height:7px;background:#1b2b3c;border-radius:99px;overflow:hidden}.metric .bar i{display:block;height:100%;background:var(--blue)}
    .split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:16px}.chart{width:100%;height:210px}.chart canvas{width:100%;height:100%}
    .filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.input{width:100%;background:#0b1722;border:1px solid #2a3e52;border-radius:8px;color:var(--text);padding:9px 10px;outline:0}.input:focus{border-color:var(--blue)} textarea.input{min-height:90px;resize:vertical}.field{display:flex;flex-direction:column;gap:5px}.field label{color:#aab9c8;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.checkline{display:flex;gap:13px;flex-wrap:wrap}.checkline label{color:#aebccb;font-size:12px}
    .modal-wrap{position:fixed;inset:0;background:#02070cb8;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.modal{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#0d1925;border:1px solid #2a4055;border-radius:16px;box-shadow:0 24px 80px #000a}.modal.wide{width:min(1480px,98vw)}.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:18px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
    .detail-answer{white-space:pre-wrap;background:#08131d;border:1px solid var(--line);border-radius:10px;padding:14px;max-height:300px;overflow:auto}.json{white-space:pre-wrap;word-break:break-all;color:#9fc0d8;font:12px/1.55 Consolas,monospace;background:#07111a;padding:12px;border-radius:9px;max-height:350px;overflow:auto}
    .toast{position:fixed;right:22px;bottom:22px;background:#16304a;border:1px solid #315d84;border-radius:10px;padding:11px 15px;z-index:60;box-shadow:0 10px 30px #0008}.toast.error{background:#421c22;border-color:#823740}.spinner{width:14px;height:14px;border:2px solid #ffffff42;border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{display:none}.content{padding:16px}.stats{grid-template-columns:1fr 1fr}.hero{display:block}.hero-actions{margin-top:12px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.metric-grid{grid-template-columns:1fr}.topbar .sub{display:none}}
  </style>
</head>
<body>
<header class="topbar">
  <div><div class="brand"><span>Eval</span>Ops</div><div class="sub">TAgent 质量评测工作台</div></div>
  <div class="tabs"><button class="tab active" id="tabDatasets" onclick="switchTab('datasets')">数据集</button><button class="tab" id="tabRuns" onclick="switchTab('runs')">评测历史</button></div>
  <div class="spacer"></div><button class="btn" onclick="location.href='/'">返回对话</button>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="side-head"><h3 id="sideTitle">Datasets</h3><div class="spacer"></div><button class="btn small primary" id="sideAdd" onclick="openDatasetModal()">新建</button></div>
    <div class="side-list" id="sideList"><div class="muted">加载中…</div></div>
  </aside>
  <main class="content" id="content"><div class="empty">正在加载 EvalOps…</div></main>
</div>

<div id="datasetModal" class="modal-wrap hidden"><div class="modal">
  <div class="modal-head"><h2>新建数据集</h2><div class="spacer"></div><button class="btn small" onclick="closeModal('datasetModal')">关闭</button></div>
  <div class="modal-body form-grid">
    <div class="field"><label>名称</label><input class="input" id="dsName" placeholder="例如：工具调用回归集"></div>
    <div class="field"><label>执行模式</label><select class="input" id="dsMode"><option value="INDEPENDENT">独立样本（可并行）</option><option value="SCENARIO">有状态场景（组内串行）</option></select></div>
    <div class="field full"><label>描述</label><textarea class="input" id="dsDescription"></textarea></div>
    <div class="field"><label>所有者 User ID</label><input class="input" id="dsOwner" value="10001"></div>
  </div><div class="modal-foot"><button class="btn" onclick="closeModal('datasetModal')">取消</button><button class="btn primary" onclick="createDataset()">创建</button></div>
</div></div>

<div id="caseModal" class="modal-wrap hidden"><div class="modal">
  <div class="modal-head"><h2 id="caseModalTitle">新增题目</h2><div class="spacer"></div><button class="btn small" onclick="closeModal('caseModal')">关闭</button></div>
  <div class="modal-body form-grid">
    <input type="hidden" id="caseId">
    <div class="field"><label>稳定编号</label><input class="input" id="caseKey" placeholder="Q1 / tool-weather-01"></div>
    <div class="field"><label>顺序</label><input class="input" id="caseSeq" type="number" min="1"></div>
    <div class="field"><label>会话分组</label><input class="input" id="caseGroup" value="default"></div>
    <div class="field"><label>类别</label><input class="input" id="caseCategory" placeholder="工具 / 记忆 / RAG"></div>
    <div class="field full"><label>问题</label><textarea class="input" id="caseQuestion"></textarea></div>
    <div class="field"><label>期望能力（逗号分隔）</label><input class="input" id="caseCapabilities" value="general"></div>
    <div class="field"><label>必须包含（逗号分隔）</label><input class="input" id="caseMustMention"></div>
    <div class="field"><label>禁止包含（逗号分隔）</label><input class="input" id="caseMustNotMention"></div>
    <div class="field"><label>标签（逗号分隔）</label><input class="input" id="caseTags"></div>
    <div class="field"><label>最大步骤</label><input class="input" id="caseMaxSteps" type="number" value="4"></div>
    <div class="field"><label>最短答案字符数（0 表示不限制）</label><input class="input" id="caseMinAnswerLength" type="number" min="0" max="10000" value="0"></div>
    <div class="field"><label>效率目标耗时（毫秒）</label><input class="input" id="caseMaxLatency" type="number" min="5000" max="1800000" value="180000"><span class="muted">超出后记录并降低效率分，但不会中断；单题达到 1800 秒才强制停止。</span></div>
    <div class="field full"><label>参考答案（可选）</label><textarea class="input" id="caseReference"></textarea></div>
    <div class="checkline full">
      <label><input type="checkbox" id="caseRag"> 期望 RAG</label><label><input type="checkbox" id="caseMemory"> 期望记忆</label><label><input type="checkbox" id="caseTools"> 期望工具</label><label><input type="checkbox" id="caseAllowTools"> 允许工具</label><label><input type="checkbox" id="caseSimple"> 简单任务</label><label><input type="checkbox" id="caseFinance"> 理财安全</label><label><input type="checkbox" id="caseEnabled" checked> 启用</label>
    </div>
  </div><div class="modal-foot"><button class="btn" onclick="closeModal('caseModal')">取消</button><button class="btn primary" onclick="saveCase()">保存题目</button></div>
</div></div>

<div id="runModal" class="modal-wrap hidden"><div class="modal">
  <div class="modal-head"><h2>发起评测</h2><div class="spacer"></div><button class="btn small" onclick="closeModal('runModal')">关闭</button></div>
  <div class="modal-body form-grid">
    <div class="field full"><label>已发布数据集版本</label><select class="input" id="runVersion" onchange="syncRunMode()"></select></div>
    <div class="field"><label>任务名称</label><input class="input" id="runName"></div>
    <div class="field"><label>指定 Agent ID（留空走路由）</label><input class="input" id="runAgent" placeholder="8011"></div>
    <div class="field"><label>记忆策略</label><select class="input" id="runMemory"><option value="ISOLATED_USER">隔离用户（推荐）</option><option value="FIXED_USER">固定用户</option></select></div>
    <div class="field"><label>固定 User ID / 数据权限</label><input class="input" id="runUser" value="10001"></div>
    <div class="field"><label>Tenant ID</label><input class="input" id="runTenant" value="default"></div>
    <div class="field"><label>单次评测内部并发数</label><input class="input" id="runConcurrency" type="number" min="1" max="8" value="3"></div>
    <div class="field"><label>场景题间等待（秒）</label><input class="input" id="runDelay" type="number" min="0" max="120" value="30"></div>
    <div class="field full"><div class="card muted" id="runModeHint">选择数据集版本后显示执行模式说明。</div></div>
  </div><div class="modal-foot"><button class="btn" onclick="closeModal('runModal')">取消</button><button class="btn primary" onclick="createRun()">开始评测</button></div>
</div></div>

<div id="judgeModal" class="modal-wrap hidden"><div class="modal">
  <div class="modal-head"><h2>发起 LLM Judge</h2><div class="spacer"></div><button class="btn small" onclick="closeModal('judgeModal')">关闭</button></div>
  <div class="modal-body form-grid">
    <div class="field"><label>判定范围</label><select class="input" id="judgeScope"><option value="ALL">全部成功题目</option><option value="LOW_SCORE">规则低分题</option><option value="FAILED">执行失败且存在答案</option></select></div>
    <div class="field"><label>低分阈值</label><input class="input" id="judgeThreshold" type="number" min="0" max="1" step="0.05" value="0.8"></div>
    <div class="field"><label>Judge Model</label><input class="input" id="judgeModel" value="deepseek-v4-pro"></div>
    <div class="field"><label>API ID</label><input class="input" id="judgeApi" value="2344_api"></div>
    <div class="field"><label>并发数</label><input class="input" id="judgeConcurrency" type="number" min="1" max="8" value="3"></div>
    <div class="field full"><div class="card muted">Judge 会读取持久化的最终答案、同会话历史、工具/RAG/记忆证据。规则分和语义分独立保存，不会互相覆盖。</div></div>
  </div><div class="modal-foot"><button class="btn" onclick="closeModal('judgeModal')">取消</button><button class="btn primary" onclick="createJudge()">开始判定</button></div>
</div></div>

<div id="codeVersionModal" class="modal-wrap hidden"><div class="modal">
  <div class="modal-head"><h2>绑定代码 Tag</h2><div class="spacer"></div><button class="btn small" onclick="closeModal('codeVersionModal')">关闭</button></div>
  <div class="modal-body form-grid">
    <div class="field full"><label>Git Tag</label><input class="input" id="codeTag" list="codeTagOptions" placeholder="例如：v1.26.0"><datalist id="codeTagOptions"></datalist></div>
    <div class="field full"><label>绑定说明</label><textarea class="input" id="codeBindingNote" placeholder="校验一致时可不填；强制绑定必须说明原因"></textarea></div>
    <div class="checkline full"><label><input type="checkbox" id="codeForce"> 校验失败时仍强制关联（结果会标记为未验证）</label></div>
    <div class="field full"><div class="card muted">平台会使用评测时冻结的忽略规则计算 Tag 源码指纹。日志、构建产物和报告不会参与比较。</div></div>
  </div><div class="modal-foot"><button class="btn" onclick="closeModal('codeVersionModal')">取消</button><button class="btn primary" onclick="bindCodeTag()">校验并绑定</button></div>
</div></div>

<div id="detailModal" class="modal-wrap hidden"><div class="modal wide">
  <div class="modal-head"><h2 id="detailTitle">题目详情</h2><div class="spacer"></div><button class="btn small" onclick="closeModal('detailModal')">关闭</button></div>
  <div class="modal-body" id="detailBody"></div>
</div></div>
<div id="toast" class="toast hidden"></div>

<script>
const API='/api/v1/eval';
const state={tab:'datasets',datasets:[],runs:[],selectedDataset:null,dataset:null,versions:[],cases:[],selectedRun:null,run:null,judgeJobs:[],poll:null,ruleSort:{key:'sequenceNo',dir:'asc'},judgeSort:{key:'overall',dir:'asc'},currentJudge:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>String(v||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean);
const fmtTime=v=>v?String(v).replace('T',' ').slice(0,19):'—';
const pct=v=>v==null?'—':`${(Number(v)*100).toFixed(1)}%`;
const score=v=>v==null?'—':Number(v).toFixed(2);
function toast(message,error=false){const e=$('toast');e.textContent=message;e.className='toast'+(error?' error':'');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),3200)}
async function api(path,options={}){const res=await fetch(API+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let body;try{body=await res.json()}catch(e){throw new Error(`HTTP ${res.status}`)}if(!res.ok||body.code!=='0000')throw new Error(body.info||`HTTP ${res.status}`);return body.data}
function badge(status){const s=String(status||'');let c='';if(['PASS','COMPLETED','PUBLISHED','RULE_COMPLETED','ACTIVE','AUTO_VERIFIED','MANUAL_VERIFIED'].includes(s))c='green';else if(['RUNNING','JUDGING','QUEUED','WAITING_TAG'].includes(s))c='blue';else if(['DRAFT','PARTIAL','CANCELLED','MANUAL_UNVERIFIED'].includes(s))c='yellow';else if(['FAILED','ERROR','TIMEOUT','CAPTURE_UNAVAILABLE','VERSION_MISMATCH'].includes(s))c='red';return `<span class="badge ${c}">${esc(s||'—')}</span>`}
function closeModal(id){$(id).classList.add('hidden')}
function switchTab(tab){state.tab=tab;$('tabDatasets').classList.toggle('active',tab==='datasets');$('tabRuns').classList.toggle('active',tab==='runs');$('sideTitle').textContent=tab==='datasets'?'Datasets':'Evaluation Runs';$('sideAdd').classList.toggle('hidden',tab!=='datasets');tab==='datasets'?renderDatasetSidebar():renderRunSidebar();if(tab==='datasets'){state.dataset?renderDatasetDetail():renderDatasetWelcome()}else{state.run?renderRunDetail():renderRunWelcome()}}
async function init(){try{await Promise.all([loadDatasets(),loadRuns()]);switchTab('datasets')}catch(e){$('content').innerHTML=`<div class="empty">EvalOps 加载失败：${esc(e.message)}<br><span class="muted">请确认已执行 V059、V060 数据库迁移。</span></div>`}}
async function loadDatasets(){state.datasets=await api('/datasets?limit=200');renderDatasetSidebar()}
async function loadRuns(){state.runs=await api('/runs?limit=200');if(state.tab==='runs')renderRunSidebar()}
function renderDatasetSidebar(){const box=$('sideList');if(!state.datasets.length){box.innerHTML='<div class="empty">暂无数据集</div>';return}box.innerHTML=state.datasets.map(d=>`<div class="side-item ${state.selectedDataset===d.datasetId?'active':''}" onclick="selectDataset('${d.datasetId}')"><div class="side-title"><span>${esc(d.name)}</span><span class="spacer"></span>${badge(d.executionMode)}</div><div class="side-meta"><span>v${d.latestVersionNo||0} · 草稿 ${d.draftCaseCount||0} 题</span><span>${fmtTime(d.updatedAt).slice(5,10)}</span></div></div>`).join('')}
function renderRunSidebar(){const box=$('sideList');if(!state.runs.length){box.innerHTML='<div class="empty">暂无评测</div>';return}box.innerHTML=state.runs.map(r=>`<div class="side-item ${state.selectedRun===r.evalRunId?'active':''}" onclick="selectRun('${r.evalRunId}')"><div class="side-title"><span class="truncate">${esc(r.name)}</span><span class="spacer"></span>${badge(r.status)}</div><div class="side-meta"><span>${r.completedCases||0}/${r.totalCases||0} · 规则 ${score(r.ruleScore)}</span><span>${fmtTime(r.createdAt).slice(5,16)}</span></div></div>`).join('')}
function renderDatasetWelcome(){$('content').innerHTML=`<div class="hero"><div><h1>数据集与版本</h1><p>将题目、断言和会话顺序做成可复现的质量基线。</p></div><div class="hero-actions"><button class="btn good" onclick="importQualityBenchmark()">导入 14维场景基准集（80题）</button><button class="btn" onclick="importE2E100()">一键迁移 E2E100</button><button class="btn primary" onclick="openDatasetModal()">新建数据集</button></div></div><div class="empty">从左侧选择数据集，或创建第一个正式评测集。</div>`}
function renderRunWelcome(){$('content').innerHTML=`<div class="hero"><div><h1>评测历史</h1><p>查看规则评分、LLM Judge、回归趋势和逐题证据。</p></div><div class="hero-actions"><button class="btn primary" onclick="openRunModal()">发起评测</button></div></div><div class="empty">从左侧选择一次评测。</div>`}
async function selectDataset(id){try{state.selectedDataset=id;state.dataset=await api('/datasets/'+id);state.versions=await api('/datasets/'+id+'/versions');state.cases=state.dataset.draftVersionId?await api('/versions/'+state.dataset.draftVersionId+'/cases'):[];renderDatasetSidebar();renderDatasetDetail()}catch(e){toast(e.message,true)}}
function renderDatasetDetail(){const d=state.dataset;const published=state.versions.filter(v=>v.status==='PUBLISHED');$('content').innerHTML=`
  <div class="hero"><div><h1>${esc(d.name)}</h1><p>${esc(d.description||'暂无描述')} · ${d.executionMode==='SCENARIO'?'组内共享 Session、按顺序执行':'每题独立 Session、支持并行'}</p></div><div class="hero-actions"><button class="btn" onclick="backToDatasetHome()">返回数据集主页</button><button class="btn" onclick="openRunModal()" ${published.length?'':'disabled'}>发起评测</button><button class="btn good" onclick="publishDataset()">发布 v${d.draftVersionNo}</button><button class="btn primary" onclick="openCaseModal()">新增题目</button><button class="btn danger" onclick="deleteDataset()">删除数据集</button></div></div>
  <div class="grid stats"><div class="card"><div class="stat-label">草稿版本</div><div class="stat-value">v${d.draftVersionNo}</div><div class="stat-note">可继续编辑</div></div><div class="card"><div class="stat-label">草稿题目</div><div class="stat-value">${state.cases.length}</div><div class="stat-note">启用 ${state.cases.filter(x=>x.enabled).length}</div></div><div class="card"><div class="stat-label">已发布版本</div><div class="stat-value">${published.length}</div><div class="stat-note">最新 v${d.latestVersionNo||0}</div></div><div class="card"><div class="stat-label">执行模式</div><div class="stat-value" style="font-size:18px">${d.executionMode}</div><div class="stat-note">${d.executionMode==='SCENARIO'?'有状态场景':'独立样本'}</div></div><div class="card"><div class="stat-label">数据所有者</div><div class="stat-value" style="font-size:18px">${esc(d.ownerUserId)}</div><div class="stat-note">用于默认权限</div></div></div>
  ${renderHistoryTrend(state.runs.filter(r=>r.datasetId===d.datasetId))}
  <div class="section"><div class="section-head"><h2>草稿题目</h2><span class="hint">发布后生成不可变快照，并自动复制出下一版草稿</span></div>${renderCases()}</div>
  <div class="section"><div class="section-head"><h2>版本记录</h2></div><table><thead><tr><th>版本</th><th>状态</th><th>题数</th><th>规则</th><th>Checksum</th><th>发布时间</th></tr></thead><tbody>${state.versions.map(v=>`<tr><td>v${v.versionNo}</td><td>${badge(v.status)}</td><td>${v.caseCount}</td><td>${esc(v.evaluatorVersion)}</td><td class="truncate">${esc(v.checksum||'—')}</td><td>${fmtTime(v.publishedAt)}</td></tr>`).join('')}</tbody></table></div>`}
function renderCases(){if(!state.cases.length)return '<div class="empty">草稿中还没有题目。</div>';return `<table><thead><tr><th>#</th><th>Key</th><th>分组</th><th>类别</th><th>问题</th><th>规则</th><th>操作</th></tr></thead><tbody>${state.cases.map(c=>`<tr><td>${c.sequenceNo}</td><td>${esc(c.stableKey)} ${c.enabled?'':'<span class="badge red">停用</span>'}</td><td>${esc(c.conversationGroup)}</td><td>${esc(c.category||'—')}</td><td class="truncate" title="${esc(c.question)}">${esc(c.question)}</td><td>${[c.config.expectRag?'RAG':'',c.config.expectMemory?'Memory':'',c.config.expectTools?'Tool':''].filter(Boolean).map(x=>`<span class="badge purple">${x}</span>`).join(' ')||'<span class="muted">基础</span>'}</td><td><button class="btn small" onclick="openCaseModalById('${c.caseId}')">编辑</button> <button class="btn small danger" onclick="deleteCase('${c.caseId}')">删除</button></td></tr>`).join('')}</tbody></table>`}
function renderHistoryTrend(runs){const rows=runs.filter(r=>r.ruleScore!=null||r.judgeScore!=null).slice(0,12).reverse();if(!rows.length)return '<div class="section"><div class="card muted">发布版本并完成评测后，这里会展示规则分与 LLM Judge 的历史趋势。</div></div>';const w=760,h=180,p=28,x=i=>p+(rows.length===1?(w-2*p)/2:i*(w-2*p)/(rows.length-1)),y=v=>h-p-Number(v)*(h-2*p);const rule=rows.filter(r=>r.ruleScore!=null).map(r=>`${x(rows.indexOf(r))},${y(r.ruleScore)}`).join(' ');const judge=rows.filter(r=>r.judgeScore!=null).map(r=>`${x(rows.indexOf(r))},${y(Number(r.judgeScore)/100)}`).join(' ');return `<div class="section"><div class="section-head"><h2>历史质量趋势</h2><span class="hint">最近 ${rows.length} 次评测</span></div><div class="card"><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:210px"><line x1="${p}" y1="${y(1)}" x2="${w-p}" y2="${y(1)}" stroke="#203246"/><line x1="${p}" y1="${y(.5)}" x2="${w-p}" y2="${y(.5)}" stroke="#203246"/><line x1="${p}" y1="${y(0)}" x2="${w-p}" y2="${y(0)}" stroke="#203246"/><text x="2" y="${y(1)+4}" fill="#8192a6" font-size="10">100</text><text x="8" y="${y(.5)+4}" fill="#8192a6" font-size="10">50</text><polyline points="${rule}" fill="none" stroke="#4f8cff" stroke-width="3"/><polyline points="${judge}" fill="none" stroke="#37d6c5" stroke-width="3"/>${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.ruleScore||0)}" r="4" fill="#4f8cff"><title>${esc(r.name)} 规则 ${(Number(r.ruleScore||0)*100).toFixed(1)}</title></circle>${r.judgeScore!=null?`<circle cx="${x(i)}" cy="${y(Number(r.judgeScore)/100)}" r="4" fill="#37d6c5"><title>Judge ${Number(r.judgeScore).toFixed(1)}</title></circle>`:''}<text x="${x(i)}" y="${h-5}" text-anchor="middle" fill="#8192a6" font-size="9">v${r.versionNo}</text>`).join('')}</svg><div class="muted"><span style="color:#4f8cff">●</span> 规则分　<span style="color:#37d6c5">●</span> LLM Judge</div></div></div>`}
function openDatasetModal(){$('dsName').value='';$('dsDescription').value='';$('datasetModal').classList.remove('hidden')}
async function createDataset(){try{const data=await api('/datasets',{method:'POST',body:JSON.stringify({name:$('dsName').value,description:$('dsDescription').value,executionMode:$('dsMode').value,ownerUserId:$('dsOwner').value})});closeModal('datasetModal');await loadDatasets();await selectDataset(data.datasetId);toast('数据集已创建')}catch(e){toast(e.message,true)}}
async function deleteDataset(){const d=state.dataset;if(!d||!confirm(`确认永久删除数据集“${d.name}”吗？\n\n其全部版本、题目、历史评测、Judge 结果和代码版本绑定都会一并删除，且无法恢复。`))return;try{await api(`/datasets/${d.datasetId}`,{method:'DELETE'});backToDatasetHome();await Promise.all([loadDatasets(),loadRuns()]);toast('数据集及关联记录已删除')}catch(e){toast(e.message,true)}}
function openCaseModal(c=null){$('caseModalTitle').textContent=c?'编辑题目':'新增题目';$('caseId').value=c?.caseId||'';$('caseKey').value=c?.stableKey||`Q${state.cases.length+1}`;$('caseSeq').value=c?.sequenceNo||state.cases.length+1;$('caseGroup').value=c?.conversationGroup||'default';$('caseCategory').value=c?.category||'';$('caseQuestion').value=c?.question||'';$('caseCapabilities').value=(c?.config?.expectedCapabilities||['general']).join(',');$('caseMustMention').value=(c?.config?.mustMention||[]).join(',');$('caseMustNotMention').value=(c?.config?.mustNotMention||[]).join(',');$('caseTags').value=(c?.tags||[]).join(',');$('caseMaxSteps').value=c?.config?.maxSteps||4;$('caseMinAnswerLength').value=c?.config?.minAnswerLength||0;$('caseMaxLatency').value=c?.config?.maxLatencyMs||180000;$('caseReference').value=c?.referenceAnswer||'';for(const [id,key] of [['caseRag','expectRag'],['caseMemory','expectMemory'],['caseTools','expectTools'],['caseAllowTools','allowTools'],['caseSimple','simpleTask'],['caseFinance','financialSafety']])$(id).checked=!!c?.config?.[key];$('caseEnabled').checked=c?!!c.enabled:true;$('caseModal').classList.remove('hidden')}
function openCaseModalById(id){openCaseModal(state.cases.find(c=>c.caseId===id)||null)}
async function saveCase(){try{const id=$('caseId').value;const body={stableKey:$('caseKey').value,sequenceNo:Number($('caseSeq').value),conversationGroup:$('caseGroup').value,category:$('caseCategory').value,tags:arr($('caseTags').value),question:$('caseQuestion').value,referenceAnswer:$('caseReference').value,enabled:$('caseEnabled').checked,config:{expectedCapabilities:arr($('caseCapabilities').value),mustMention:arr($('caseMustMention').value),mustNotMention:arr($('caseMustNotMention').value),allowGeneralFallback:true,expectRag:$('caseRag').checked,expectMemory:$('caseMemory').checked,expectTools:$('caseTools').checked,allowTools:$('caseAllowTools').checked,simpleTask:$('caseSimple').checked,financialSafety:$('caseFinance').checked,maxSteps:Number($('caseMaxSteps').value),minAnswerLength:Number($('caseMinAnswerLength').value),maxLatencyMs:Number($('caseMaxLatency').value)}};await api(`/datasets/${state.selectedDataset}/cases${id?'/'+id:''}`,{method:'POST',body:JSON.stringify(body)});closeModal('caseModal');await selectDataset(state.selectedDataset);toast('题目已保存')}catch(e){toast(e.message,true)}}
async function deleteCase(id){if(!confirm('确认从当前草稿删除这道题？'))return;try{await api(`/datasets/${state.selectedDataset}/cases/${id}`,{method:'DELETE'});await selectDataset(state.selectedDataset);toast('题目已删除')}catch(e){toast(e.message,true)}}
async function publishDataset(){if(!confirm(`发布 v${state.dataset.draftVersionNo}？发布后该版本不可修改。`))return;try{await api(`/datasets/${state.selectedDataset}/publish`,{method:'POST',body:JSON.stringify({description:`${state.dataset.name} v${state.dataset.draftVersionNo}`})});await loadDatasets();await selectDataset(state.selectedDataset);toast('数据集版本已发布')}catch(e){toast(e.message,true)}}
async function importE2E100(){if(!confirm('将原测试类中的 100 道题迁移为 E2E100 v1，并保留一份 v2 草稿？'))return;try{const data=await api('/datasets/import/e2e100',{method:'POST',body:JSON.stringify({ownerUserId:'10001'})});await loadDatasets();await selectDataset(data.datasetId);toast('E2E100 已迁移并发布')}catch(e){toast(e.message,true)}}
async function importQualityBenchmark(){if(!confirm('导入“Agent 14维场景基准集（80题版）”？\n\n将创建80道题、16个隔离会话组并发布 v1，同时保留可编辑的 v2 草稿。RAG 场景评测建议选择 FIXED_USER 10001。'))return;try{const data=await api('/datasets/import/quality-benchmark',{method:'POST',body:JSON.stringify({ownerUserId:'10001'})});await loadDatasets();await selectDataset(data.datasetId);toast('14维场景基准集（80题版）已导入并发布')}catch(e){toast(e.message,true)}}
async function openRunModal(){try{if(!state.datasets.length)throw new Error('请先创建数据集');const options=[];for(const d of state.datasets){const versions=await api(`/datasets/${d.datasetId}/versions`);for(const v of versions.filter(x=>x.status==='PUBLISHED'))options.push({d,v})}if(!options.length)throw new Error('没有已发布的数据集版本');$('runVersion').innerHTML=options.map(({d,v})=>`<option value="${v.versionId}" data-mode="${esc(d.executionMode)}" ${d.datasetId===state.selectedDataset?'selected':''}>${esc(d.name)} · v${v.versionNo} · ${v.caseCount}题 · ${esc(d.executionMode)}</option>`).join('');$('runName').value='';syncRunMode();$('runModal').classList.remove('hidden')}catch(e){toast(e.message,true)}}
function syncRunMode(){const option=$('runVersion').selectedOptions[0],mode=option?.dataset.mode||'INDEPENDENT',scenario=mode==='SCENARIO',active=state.runs.filter(r=>['QUEUED','RUNNING','JUDGING'].includes(r.status)).length;$('runConcurrency').disabled=scenario;$('runDelay').disabled=!scenario;if(scenario){$('runConcurrency').value=1;$('runModeHint').innerHTML=`<b>SCENARIO 场景模式</b><br>本次评测会强制单线程顺序执行，同组题目共享 Session。固定用户模式下不建议同时运行多个评测，避免长期记忆互相影响。${active?`<br><span style="color:var(--yellow)">当前还有 ${active} 个评测正在排队或运行。</span>`:''}`}else{if(Number($('runConcurrency').value)<=1)$('runConcurrency').value=3;$('runModeHint').innerHTML=`<b>INDEPENDENT 独立样本模式</b><br>并发数表示这一次评测内部最多同时执行多少道题；每道题使用独立 Session。${active?` 当前另有 ${active} 个评测正在运行。`:''}`}}
function backToDatasetHome(){state.selectedDataset=null;state.dataset=null;state.versions=[];state.cases=[];renderDatasetSidebar();renderDatasetWelcome()}
function backToRunHome(){clearInterval(state.poll);state.poll=null;state.selectedRun=null;state.run=null;state.judgeJobs=[];renderRunSidebar();renderRunWelcome()}
async function createRun(){try{const data=await api('/runs',{method:'POST',body:JSON.stringify({versionId:$('runVersion').value,name:$('runName').value,userId:$('runUser').value,tenantId:$('runTenant').value,selectedAgentId:$('runAgent').value,memoryPolicy:$('runMemory').value,concurrency:Number($('runConcurrency').value),interCaseDelayMs:Number($('runDelay').value)*1000})});closeModal('runModal');await loadRuns();switchTab('runs');await selectRun(data.evalRunId);toast('评测任务已进入队列')}catch(e){toast(e.message,true)}}
async function selectRun(id,silent=false){try{state.selectedRun=id;state.run=await api('/runs/'+id);state.judgeJobs=await api(`/runs/${id}/judge-jobs`);if(!silent)renderRunSidebar();renderRunDetail();managePolling()}catch(e){if(!silent)toast(e.message,true)}}
function renderRunDetail(){const r=state.run,results=r.results||[],done=results.filter(x=>['PASS','FAIL','ERROR','TIMEOUT'].includes(x.status)),progress=r.totalCases?Math.round((r.completedCases||0)*100/r.totalCases):0,active=['QUEUED','RUNNING','JUDGING'].includes(r.status),judgeRetryable=['RULE_COMPLETED','COMPLETED'].includes(r.status)||(r.status==='CANCELLED'&&r.totalCases>0&&r.completedCases===r.totalCases);const avg={};for(const key of ['route','answer','step','tool','grounding','memory','stability','efficiency','safety']){const vals=done.map(x=>x.scores?.[key]).filter(x=>x!=null);avg[key]=vals.length?vals.reduce((a,b)=>a+Number(b),0)/vals.length:0}$('content').innerHTML=`
 <div class="hero"><div><h1>${esc(r.name)}</h1><p>${esc(r.evalRunId)} · v${r.versionNo} · ${esc(r.evaluatorVersion)}</p></div><div class="hero-actions"><button class="btn" onclick="backToRunHome()">返回评测主页</button><button class="btn" onclick="refreshCurrentRun()">刷新</button><button class="btn" onclick="openCodeVersionModal()">绑定 Tag</button>${active?'<button class="btn danger" onclick="cancelRun()">中断评测</button>':''}<button class="btn danger" onclick="deleteRun()">删除评测</button><button class="btn primary" onclick="openJudgeModal()" ${judgeRetryable?'':'disabled'}>LLM Judge</button></div></div>
 <div class="grid stats"><div class="card"><div class="stat-label">状态</div><div class="stat-value" style="font-size:18px">${badge(r.status)}</div><div class="stat-note">${r.errorMessage?esc(r.errorMessage):'异步持久化执行'}</div></div><div class="card"><div class="stat-label">进度</div><div class="stat-value">${r.completedCases||0}/${r.totalCases}</div><div class="progress"><i style="width:${progress}%"></i></div></div><div class="card"><div class="stat-label">规则评分</div><div class="stat-value">${score(r.ruleScore)}</div><div class="stat-note">九维确定性规则</div></div><div class="card"><div class="stat-label">LLM Judge</div><div class="stat-value">${r.judgeScore==null?'—':Number(r.judgeScore).toFixed(1)}</div><div class="stat-note">五维语义质量</div></div><div class="card"><div class="stat-label">通过 / 失败</div><div class="stat-value">${r.passedCases||0}<span class="muted" style="font-size:16px"> / ${r.failedCases||0}</span></div><div class="stat-note">规则结果不被 Judge 覆盖</div></div></div>
 <div class="split"><div class="card"><div class="section-head"><h2>规则维度</h2></div><div class="metric-grid">${Object.entries(avg).map(([k,v])=>`<div class="metric"><span>${k}</span><div class="bar"><i style="width:${v*100}%"></i></div><b class="num">${v.toFixed(2)}</b></div>`).join('')}</div></div><div class="card"><div class="section-head"><h2>运行配置</h2></div><div class="muted">模式：${esc(r.executionMode)}<br>用户：${esc(r.userId)}（${esc(r.memoryPolicy)}）<br>Agent：${esc(r.selectedAgentId||'自动路由')}<br>并发：${r.concurrency}<br>开始：${fmtTime(r.startedAt)}<br>结束：${fmtTime(r.finishedAt)}</div></div></div>
 <div class="section"><div class="section-head"><h2>代码版本</h2><span class="hint">下次发起评测前会自动匹配等待中的 Tag</span></div>${renderCodeVersion(r.codeVersion)}</div>
 <div class="section"><div class="section-head"><h2>逐题结果</h2><span class="hint">点击行查看答案、扣分和完整 Trace</span></div>${renderResults(results)}</div>
 <div class="section"><div class="section-head"><h2>Judge 记录</h2></div>${renderJudgeJobs()}</div>`}
function renderCodeVersion(c){if(!c)return '<div class="card muted">该历史评测没有代码快照。新评测会在执行 V060 后自动保存。</div>';const captured=`${esc(c.branch||'—')} @ ${esc((c.capturedHeadSha||'').slice(0,12)||'—')}`;const bound=c.boundTag?`${esc(c.boundTag)} @ ${esc((c.boundCommitSha||'').slice(0,12))}`:'尚未绑定正式 Tag';return `<div class="card"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b>${bound}</b>${badge(c.bindingStatus)}${c.dirty?'<span class="badge yellow">评测时有未提交源码</span>':'<span class="badge green">评测时源码已提交</span>'}</div><div class="muted" style="margin-top:10px">被测快照：${captured}<br>有效源码指纹：${esc(c.sourceTreeHash||'不可用')}<br>绑定方式：${esc(c.bindingMethod||'等待自动或手动绑定')}<br>捕获时间：${fmtTime(c.capturedAt)}　最近检查：${fmtTime(c.lastCheckedAt)}${c.bindingNote?`<br>说明：${esc(c.bindingNote)}`:''}${c.warning?`<br>警告：${esc(c.warning)}`:''}</div></div>`}
const statusOrder={FAILED:0,ERROR:1,TIMEOUT:2,CANCELLED:3,PARTIAL:4,QUEUED:5,RUNNING:6,JUDGING:6,FAIL:7,PASS:8,COMPLETED:8};
function sortValue(row,key){if(key==='ruleOverall')return row.scores?.overall;if(key==='warningCount')return (row.warnings||[]).length;return row[key]}
function sortedRows(rows,sort){return rows.map((row,index)=>({row,index})).sort((a,b)=>{let av=sortValue(a.row,sort.key),bv=sortValue(b.row,sort.key);if(sort.key==='status'){av=statusOrder[av]??99;bv=statusOrder[bv]??99}if(av==null&&bv==null)return a.index-b.index;if(av==null)return 1;if(bv==null)return-1;let compared=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'zh-CN',{numeric:true});if(compared===0)compared=(a.row.sequenceNo??a.index)-(b.row.sequenceNo??b.index);return sort.dir==='asc'?compared:-compared}).map(x=>x.row)}
function sortHead(scope,key,label){const sort=scope==='rule'?state.ruleSort:state.judgeSort,mark=sort.key===key?(sort.dir==='asc'?' ▲':' ▼'):'';return `<th class="sortable" onclick="changeSort('${scope}','${key}')">${label}${mark}</th>`}
function changeSort(scope,key){const name=scope==='rule'?'ruleSort':'judgeSort',current=state[name];state[name]=current.key===key?{key,dir:current.dir==='asc'?'desc':'asc'}:{key,dir:key==='overall'?'asc':'asc'};scope==='rule'?renderRunDetail():renderJudgeDetail()}
function renderResults(results){if(!results.length)return '<div class="empty">等待任务生成题目结果…</div>';const rows=sortedRows(results,state.ruleSort);return `<table><thead><tr>${sortHead('rule','sequenceNo','#')}<th>题目</th>${sortHead('rule','status','状态')}${sortHead('rule','agentId','Agent')}${sortHead('rule','strategy','策略')}${sortHead('rule','ruleOverall','规则分')}<th>等级</th>${sortHead('rule','latencyMs','耗时')}${sortHead('rule','warningCount','观察')}</tr></thead><tbody>${rows.map(x=>`<tr onclick="openResult('${x.resultId}')" style="cursor:pointer"><td>${x.sequenceNo||'—'}</td><td><div>${esc(x.stableKey)} · ${esc(x.category||'')}</div><div class="muted truncate">${esc(x.question||'')}</div></td><td>${badge(x.status)}</td><td>${esc(x.agentId||'—')}</td><td><div class="muted truncate">${esc(x.strategy||'—')}</div></td><td class="num">${score(x.scores?.overall)}</td><td>${esc(x.grade||'—')}</td><td>${x.latencyMs==null?'—':Math.round(x.latencyMs/1000)+'s'}</td><td>${(x.warnings||[]).length?`<span class="badge yellow">${x.warnings.length} 项</span>`:'—'}</td></tr>`).join('')}</tbody></table>`}
function renderJudgeJobs(){if(!state.judgeJobs.length)return '<div class="empty">尚未发起 LLM Judge。</div>';return `<table><thead><tr><th>任务</th><th>范围</th><th>模型</th><th>状态</th><th>进度</th><th>均分</th><th>失败</th></tr></thead><tbody>${state.judgeJobs.map(j=>`<tr><td class="link" onclick="openJudgeDetail('${j.judgeJobId}')">${esc(j.judgeJobId.slice(0,8))}</td><td>${esc(j.scopeType)}</td><td>${esc(j.modelId)}</td><td>${badge(j.status)}</td><td>${j.completedCases||0}/${j.totalCases||0}</td><td>${j.averageScore==null?'—':Number(j.averageScore).toFixed(1)}</td><td>${j.failedCases||0}</td></tr>`).join('')}</tbody></table>`}
async function refreshCurrentRun(){await Promise.all([loadRuns(),selectRun(state.selectedRun,true)]);renderRunSidebar()}
async function cancelRun(){const r=state.run;if(!r||!['QUEUED','RUNNING','JUDGING'].includes(r.status)||!confirm(`确认中断评测“${r.name}”吗？\n\n已完成的题目和得分会保留，尚未完成的题目会标记为 CANCELLED。`))return;try{clearInterval(state.poll);state.poll=null;await api(`/runs/${r.evalRunId}/cancel`,{method:'POST'});await Promise.all([loadRuns(),selectRun(r.evalRunId,true)]);renderRunSidebar();toast('评测已中断，已有结果已保留')}catch(e){managePolling();toast(e.message,true)}}
async function deleteRun(){const r=state.run;if(!r)return;const active=['QUEUED','RUNNING','JUDGING'].includes(r.status),message=active?`确认永久删除正在进行的评测“${r.name}”吗？\n\n系统会先中断评测，再删除逐题结果、Judge 记录和代码版本绑定，且无法恢复。`:`确认永久删除评测“${r.name}”吗？\n\n逐题结果、Judge 记录和代码版本绑定都会一并删除，且无法恢复。`;if(!confirm(message))return;clearInterval(state.poll);state.poll=null;try{await api(`/runs/${r.evalRunId}`,{method:'DELETE'});backToRunHome();await loadRuns();toast(active?'评测已中断并删除':'评测已删除')}catch(e){managePolling();toast(e.message,true)}}
function managePolling(){clearInterval(state.poll);if(state.run&&['QUEUED','RUNNING','JUDGING'].includes(state.run.status)){state.poll=setInterval(async()=>{await loadRuns();await selectRun(state.selectedRun,true);renderRunSidebar()},3000)}}
async function openResult(id){try{const x=await api(`/runs/${state.selectedRun}/results/${id}`);$('detailTitle').textContent=`${x.stableKey} · ${x.category||'题目详情'}`;$('detailBody').innerHTML=`<div class="card"><b>问题</b><p>${esc(x.question)}</p></div><div class="section"><div class="section-head"><h2>规则评分</h2></div><div class="metric-grid">${Object.entries(x.scores||{}).map(([k,v])=>`<div class="metric"><span>${k}</span><div class="bar"><i style="width:${Number(v||0)*100}%"></i></div><b>${score(v)}</b></div>`).join('')}</div></div><div class="section"><h3>扣分 / 观察</h3>${(x.warnings||[]).length?`<ul>${x.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:'<span class="muted">无</span>'}</div><div class="section"><h3>最终答案</h3><div class="detail-answer">${esc(x.finalAnswer||'（无答案）')}</div></div><div class="section"><h3>完整 Trace</h3><details><summary class="link">展开 JSON</summary><pre class="json">${esc(JSON.stringify(x.trace,null,2))}</pre></details></div>`;$('detailModal').classList.remove('hidden')}catch(e){toast(e.message,true)}}
async function openCodeVersionModal(){try{const tags=await api('/code-tags?limit=100');$('codeTagOptions').innerHTML=tags.map(x=>`<option value="${esc(x.tag)}">${esc((x.commitSha||'').slice(0,12))}</option>`).join('');$('codeTag').value=state.run?.codeVersion?.boundTag||'';$('codeBindingNote').value='';$('codeForce').checked=false;$('codeVersionModal').classList.remove('hidden')}catch(e){toast(e.message,true)}}
async function bindCodeTag(){try{const data=await api(`/runs/${state.selectedRun}/code-version/bind`,{method:'POST',body:JSON.stringify({tag:$('codeTag').value,force:$('codeForce').checked,note:$('codeBindingNote').value})});state.run.codeVersion=data;closeModal('codeVersionModal');renderRunDetail();toast(data.bindingStatus==='MANUAL_VERIFIED'?'Tag 校验一致并已绑定':'Tag 已按未验证方式绑定')}catch(e){toast(e.message,true)}}
function openJudgeModal(){$('judgeModal').classList.remove('hidden')}
async function createJudge(){try{await api(`/runs/${state.selectedRun}/judge`,{method:'POST',body:JSON.stringify({scopeType:$('judgeScope').value,threshold:Number($('judgeThreshold').value),modelId:$('judgeModel').value,apiId:$('judgeApi').value,concurrency:Number($('judgeConcurrency').value)})});closeModal('judgeModal');await selectRun(state.selectedRun,true);toast('LLM Judge 已进入队列')}catch(e){toast(e.message,true)}}
async function openJudgeDetail(id){try{state.currentJudge=await api('/judge-jobs/'+id);renderJudgeDetail();$('detailModal').classList.remove('hidden')}catch(e){toast(e.message,true)}}
function renderJudgeDetail(){const j=state.currentJudge;if(!j)return;$('detailTitle').textContent=`Judge ${j.judgeJobId.slice(0,8)} · ${j.status}`;const rows=sortedRows(j.results||[],state.judgeSort);$('detailBody').innerHTML=`<div class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="stat-label">语义均分</div><div class="stat-value">${j.averageScore==null?'—':Number(j.averageScore).toFixed(1)}</div></div><div class="card"><div class="stat-label">完成</div><div class="stat-value">${j.completedCases||0}/${j.totalCases||0}</div></div><div class="card"><div class="stat-label">失败</div><div class="stat-value">${j.failedCases||0}</div></div></div><div class="section"><div class="section-head"><h2>逐题对照</h2><span class="hint">点击表头排序；每题完整 JSON 会按需读取执行 Trace</span><div class="actions"><button class="btn small" onclick="downloadJudgeBatch()">下载全部完整 JSON</button></div></div><div style="overflow:auto"><table><thead><tr>${sortHead('judge','sequenceNo','#')}<th>题目</th>${sortHead('judge','status','状态')}${sortHead('judge','overall','总分')}${sortHead('judge','correctness','正确')}${sortHead('judge','relevance','切题')}${sortHead('judge','completeness','完整')}${sortHead('judge','usefulness','实用')}${sortHead('judge','safety','安全')}${sortHead('judge','agentId','Agent')}${sortHead('judge','strategy','策略')}<th>判定 / 原因</th><th>完整 JSON</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.sequenceNo||'—'}</td><td><div class="link" onclick="openJudgeComparison('${x.resultId}')">${esc(x.stableKey||x.resultId.slice(0,8))} · ${esc(x.category||'')}</div><div class="muted truncate" title="${esc(x.question||'')}">${esc(x.question||'（题目信息不可用）')}</div></td><td>${badge(x.status)}</td><td class="num">${x.overall??'—'}</td><td>${x.correctness??'—'}</td><td>${x.relevance??'—'}</td><td>${x.completeness??'—'}</td><td>${x.usefulness??'—'}</td><td>${x.safety??'—'}</td><td>${esc(x.agentId||'—')}</td><td><div class="truncate">${esc(x.strategy||'—')}</div></td><td><b>${esc(x.verdict||'—')}</b><div class="muted" style="min-width:260px">${esc(x.reason||x.errorMessage||'—')}</div></td><td><button class="btn small" onclick="showJudgeJson('${x.resultId}')">查看完整 JSON</button></td></tr>`).join('')}</tbody></table></div></div>`}
function judgeComparisonJson(x){return {stableKey:x.stableKey,sequenceNo:x.sequenceNo,category:x.category,conversationGroup:x.conversationGroup,question:x.question,referenceAnswer:x.referenceAnswer,finalAnswer:x.finalAnswer,agent:{agentId:x.agentId,strategy:x.strategy,caseStatus:x.caseStatus},ruleEvaluation:{scores:x.ruleScores,grade:x.ruleGrade,warnings:x.ruleWarnings,signals:x.ruleSignals},executionTrace:x.executionTrace,llmJudge:{status:x.status,overall:x.overall,correctness:x.correctness,relevance:x.relevance,completeness:x.completeness,usefulness:x.usefulness,safety:x.safety,verdict:x.verdict,reason:x.reason,issues:x.issues,errorMessage:x.errorMessage,rawResponse:x.rawResponse}}}
function currentJudgeResult(id){return (state.currentJudge?.results||[]).find(x=>x.resultId===id)}
function metricGrid(scores,scale=1){return `<div class="metric-grid">${Object.entries(scores||{}).map(([k,v])=>`<div class="metric"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(v||0)*100/scale))}%"></i></div><b class="num">${v==null?'—':Number(v).toFixed(scale===1?2:0)}</b></div>`).join('')}</div>`}
function openJudgeComparison(id){const x=currentJudgeResult(id);if(!x)return;$('detailTitle').textContent=`${x.stableKey||x.resultId.slice(0,8)} · 规则 / Judge 对照`;$('detailBody').innerHTML=`<div class="section-head"><button class="btn small" onclick="renderJudgeDetail()">← 返回 Judge 列表</button><div class="spacer"></div><button class="btn small" onclick="showJudgeJson('${x.resultId}')">查看 JSON</button></div><div class="card"><b>问题</b><p>${esc(x.question||'—')}</p></div><div class="section"><div class="card"><b>参考答案 / 判定要点</b><p>${esc(x.referenceAnswer||'—')}</p></div></div><div class="section"><div class="card"><b>实际回答</b><div class="muted">Agent ${esc(x.agentId||'—')} · ${esc(x.strategy||'—')}</div><div class="detail-answer" style="margin-top:10px">${esc(x.finalAnswer||'（无答案）')}</div></div></div><div class="split section"><div class="card"><div class="section-head"><h2>规则九维</h2><span class="hint">总分 ${score(x.ruleScores?.overall)} · ${esc(x.ruleGrade||'—')}</span></div>${metricGrid(x.ruleScores||{},1)}<h3>规则观察</h3>${(x.ruleWarnings||[]).length?`<ul>${x.ruleWarnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:'<span class="muted">无</span>'}</div><div class="card"><div class="section-head"><h2>Judge 五维</h2><span class="hint">总分 ${x.overall??'—'} · ${esc(x.verdict||'—')}</span></div>${metricGrid({correctness:x.correctness,relevance:x.relevance,completeness:x.completeness,usefulness:x.usefulness,safety:x.safety},5)}<h3>判定原因</h3><p>${esc(x.reason||x.errorMessage||'—')}</p><h3>Issues</h3>${(x.issues||[]).length?`<ul>${x.issues.map(w=>`<li>${esc(typeof w==='string'?w:JSON.stringify(w))}</li>`).join('')}</ul>`:'<span class="muted">无</span>'}</div></div>`}
async function showJudgeJson(id){const x=currentJudgeResult(id);if(!x)return;try{if(x.executionTrace===undefined){const detail=await api(`/runs/${state.currentJudge.evalRunId}/results/${x.resultId}`);x.executionTrace=detail.trace}const data=judgeComparisonJson(x),text=JSON.stringify(data,null,2);$('detailTitle').textContent=`${x.stableKey||x.resultId.slice(0,8)} · 完整评测 JSON`;$('detailBody').innerHTML=`<div class="section-head"><button class="btn small" onclick="renderJudgeDetail()">← 返回 Judge 列表</button><div class="spacer"></div><button class="btn small" onclick="copyJudgeJson('${x.resultId}')">复制 JSON</button><button class="btn small" onclick="downloadJudgeJson('${x.resultId}')">下载 JSON</button></div><pre class="json" style="max-height:68vh">${esc(text)}</pre>`}catch(e){toast(e.message,true)}}
async function copyText(value){try{await navigator.clipboard.writeText(value)}catch(e){const box=document.createElement('textarea');box.value=value;document.body.appendChild(box);box.select();document.execCommand('copy');box.remove()}}
async function copyJudgeJson(id){const x=currentJudgeResult(id);if(!x)return;await copyText(JSON.stringify(judgeComparisonJson(x),null,2));toast('JSON 已复制')}
function downloadJsonFile(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadJudgeJson(id){const x=currentJudgeResult(id);if(x)downloadJsonFile(`${x.stableKey||x.resultId}.json`,judgeComparisonJson(x))}
async function downloadJudgeBatch(){const j=state.currentJudge;if(!j)return;try{const rows=j.results||[];toast('正在读取全部题目的完整 Trace…');for(let i=0;i<rows.length;i+=4){await Promise.all(rows.slice(i,i+4).map(async x=>{if(x.executionTrace===undefined){const detail=await api(`/runs/${j.evalRunId}/results/${x.resultId}`);x.executionTrace=detail.trace}}))}downloadJsonFile(`judge-${j.judgeJobId}.json`,{judgeJobId:j.judgeJobId,modelId:j.modelId,status:j.status,averageScore:j.averageScore,results:rows.map(judgeComparisonJson)});toast('完整 Judge JSON 已下载')}catch(e){toast(e.message,true)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-wrap').forEach(x=>x.classList.add('hidden'))});
init();
</script>
</body>
</html>
