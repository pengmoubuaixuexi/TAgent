<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAgent · 我的知识库</title><link rel="stylesheet" href="/knowledge.css"><script src="/auth.js"></script><script src="/knowledge.js" defer></script><link rel="stylesheet" href="/workspace-nav.css"><script defer src="/workspace-nav.js"></script>
</head>
<body>
<div data-workspace-nav hidden></div><span id="account" hidden></span>
<main><div class="heading"><div><h1>我的知识库</h1><p>上传自己的资料，查看每一步处理结果，再把知识库绑定到 Agent 节点。</p></div><button id="refresh" type="button">刷新</button></div>
<div id="notice" class="notice" role="status" aria-live="polite">正在加载…</div>
<section class="panel"><h2>上传资料</h2><form id="upload-form"><div class="upload-grid"><label>知识库标签<input id="knowledge-tag" required maxlength="128" list="knowledge-tags" placeholder="例如：我的论文资料"><datalist id="knowledge-tags"></datalist><small>相同标签下的文件属于同一个知识库；标签只在你的账户内生效。</small></label><label>文件<input id="files" type="file" required multiple accept=".txt,.md,.pdf,.doc,.docx,.ppt,.pptx,.csv,.json,.html,.htm"><small>支持 PDF、Word、PowerPoint 和文本，默认每个文件最多 20 MB。</small></label></div><p class="hint">向量索引和检索测试使用平台辅助模型服务；如关闭了这项授权，请先在模型设置中开启。失败后原件会保留，重试可能再次产生模型用量。</p><button id="upload" class="primary" type="submit">上传并开始入库</button><span id="upload-progress" class="muted"></span></form></section>
<section class="panel"><div class="section-heading"><h2>文件与处理任务</h2><span id="poll-state" class="muted"></span></div><p class="hint">只有全部索引写入成功后，文件才会进入可用知识库。处理中删除会先取消入库；停止后再次点击删除完成清理。</p><div class="table-wrap"><table><thead><tr><th>文件 / 知识库</th><th>处理状态</th><th>片段 / 尝试</th><th>操作</th></tr></thead><tbody id="file-list"></tbody></table></div></section>
<section class="panel"><h2>检索测试</h2><p class="hint">直接检查自己的知识库能召回哪些片段，不生成聊天回答。此操作会调用向量模型。</p><form id="search-form"><div class="search-grid"><label>知识库<select id="search-tag" required><option value="">请选择</option></select></label><label>检索问题<input id="search-query" required maxlength="1000" placeholder="输入资料中应该能回答的问题"></label><button id="search" class="primary" type="submit">测试召回</button></div></form><div id="search-state" role="status"></div><div id="search-results" class="results"></div></section>
</main><dialog id="preview"><div class="section-heading"><h2 id="preview-title">文件片段</h2><button id="close-preview" type="button">关闭</button></div><p id="preview-state" class="hint"></p><div id="preview-chunks" class="results"></div><div class="pager"><button id="previous-page" type="button">上一页</button><span id="preview-page"></span><button id="next-page" type="button">下一页</button></div></dialog></body></html>
