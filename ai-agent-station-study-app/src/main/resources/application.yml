spring:
  session:
    timeout: 8h
    redis:
      namespace: tagent:login
      flush-mode: on_save
  config:
    name: ai-agent-station-study-app
  profiles:
    active: dev
server:
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
agent:
  model-connections:
    # Exact HTTPS provider hosts only; public DNS and same-origin request checks still apply.
    allowed-hosts: ${PERSONAL_MODEL_ALLOWED_HOSTS:api.openai.com,api.deepseek.com,api.siliconflow.cn,api.xiaomimimo.com}
