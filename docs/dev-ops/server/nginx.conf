map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
server {
    listen 80;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s;
    set $app http://app:8099;
    location = /_admin_auth {
        internal;
        proxy_pass $app/api/v1/auth/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /actuator { return 404; }
    location /ops/grafana/ {
        auth_request /_admin_auth;
        set $upstream http://grafana:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER admin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /ops/kibana/ {
        auth_request /_admin_auth;
        set $upstream http://kibana:5601;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /ops/jaeger/ {
        auth_request /_admin_auth;
        set $upstream http://jaeger:16686;
        proxy_pass $upstream;
    }
    location /ops/prometheus/ {
        auth_request /_admin_auth;
        rewrite ^/ops/prometheus/(.*)$ /$1 break;
        set $upstream http://prometheus:9090;
        proxy_pass $upstream;
    }
    location /ops/ { return 404; }
    location / {
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
