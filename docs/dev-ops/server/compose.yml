name: tagent
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  nginx:
    <<: *service
    image: nginx:1.28-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [app]
    mem_limit: 64m
  app:
    <<: *service
    build: {context: ../../.., dockerfile: docs/dev-ops/server/Dockerfile}
    env_file: .env
    environment:
      JAVA_OPTS: "-Xms128m -Xmx768m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError"
      TZ: Asia/Shanghai
    volumes:
      - ./application-cloud.yml:/app/config/application-cloud.yml:ro
      - app-data:/app/data
      - npm-cache:/app/.npm
      - ./import/calendar:/app/calendar
    depends_on:
      mysql: {condition: service_healthy}
      vector_db: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 1280m
  mysql:
    <<: *service
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai-agent-station-study
      MYSQL_USER: ${MYSQL_USER:-tagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    command: ["--innodb-buffer-pool-size=134217728", "--max-connections=40", "--performance-schema=OFF"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -uroot --silent"]
      interval: 10s
      retries: 12
    mem_limit: 512m
  vector_db:
    <<: *service
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/pgvector:v0.5.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ai-rag-knowledge
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ai-rag-knowledge"]
      interval: 10s
      retries: 12
    mem_limit: 256m
  redis:
    <<: *service
    image: redis:6.2
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    mem_limit: 160m
  elasticsearch:
    <<: *service
    image: elasticsearch:7.17.28
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    mem_limit: 768m
  logstash:
    <<: *service
    image: logstash:7.17.28
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      PIPELINE_WORKERS: "1"
      PIPELINE_BATCH_SIZE: "50"
      XPACK_MONITORING_ENABLED: "false"
    volumes: ["./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    depends_on: [elasticsearch]
    mem_limit: 512m
  kibana:
    <<: *service
    image: kibana:7.17.28
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_BASEPATH: /ops/kibana
      SERVER_REWRITEBASEPATH: "true"
      NODE_OPTIONS: --max-old-space-size=256
    depends_on: [elasticsearch]
    mem_limit: 512m
  prometheus:
    <<: *service
    image: prom/prometheus:v2.47.2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=1GB", "--web.external-url=/ops/prometheus/", "--web.route-prefix=/"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prom-data:/prometheus"]
    mem_limit: 192m
  grafana:
    <<: *service
    image: grafana/grafana:10.2.0
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN:?Set DOMAIN}/ops/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_AUTO_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    mem_limit: 256m
  jaeger:
    <<: *service
    image: jaegertracing/all-in-one:1.57
    environment: {COLLECTOR_OTLP_ENABLED: "true", MEMORY_MAX_TRACES: "2000", QUERY_BASE_PATH: /ops/jaeger}
    mem_limit: 160m
  node-exporter:
    <<: *service
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    mem_limit: 64m
  grafana-mcp:
    <<: *service
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/grafana-mcp:latest
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    mem_limit: 96m
  mcp-server-csdn-app:
    <<: *service
    profiles: [optional-publish]
    image: fuzhengwei/mcp-server-csdn-app:1.1
    environment:
      SERVER_PORT: "8101"
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m
      CSDN_API_COOKIE: ${CSDN_API_COOKIE:-}
      CSDN_API_CATEGORIES: Java
    mem_limit: 256m
  mcp-server-weixin-app:
    <<: *service
    profiles: [optional-publish]
    image: fuzhengwei/mcp-server-weixin-app:1.1
    environment:
      SERVER_PORT: "8102"
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m
      WEIXIN_API_ORIGINAL_ID: ${WEIXIN_API_ORIGINAL_ID:-}
      WEIXIN_API_APP_ID: ${WEIXIN_API_APP_ID:-}
      WEIXIN_API_APP_SECRET: ${WEIXIN_API_APP_SECRET:-}
      WEIXIN_API_TEMPLATE_ID: ${WEIXIN_API_TEMPLATE_ID:-}
      WEIXIN_API_TOUSER: ${WEIXIN_API_TOUSER:-}
    mem_limit: 256m
  mcp-server-hmdp:
    <<: *service
    build: {context: ../../../mcp-server-hmdp}
    environment: {MCP_TRANSPORT: sse, MCP_HOST: 0.0.0.0, MCP_PORT: "9000", HMDP_API_URL: "${HMDP_API_URL:-http://hmdp:8081}"}
    mem_limit: 160m
  markitdown:
    <<: *service
    build: {context: ., dockerfile: markitdown.Dockerfile}
    mem_limit: 256m
  # Optional database consoles: SSH tunnel only; never publish on 0.0.0.0.
  phpmyadmin:
    <<: *service
    profiles: [maintenance]
    image: phpmyadmin:5.2.1
    environment: {PMA_HOST: mysql}
    ports: ["127.0.0.1:8899:80"]
    mem_limit: 128m
  pgadmin:
    <<: *service
    profiles: [maintenance]
    image: dpage/pgadmin4:9.1
    environment: {PGADMIN_DEFAULT_EMAIL: "${ADMIN_EMAIL:-admin@example.com}", PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD}"}
    ports: ["127.0.0.1:5050:80"]
    volumes: ["pgadmin-data:/var/lib/pgadmin"]
    mem_limit: 256m
  redis-admin:
    <<: *service
    profiles: [maintenance]
    image: spryker/redis-commander:0.8.0
    environment: {REDIS_HOSTS: "local:redis:6379", HTTP_USER: admin, HTTP_PASSWORD: "${REDIS_ADMIN_PASSWORD:?Set REDIS_ADMIN_PASSWORD}"}
    ports: ["127.0.0.1:8081:8081"]
    mem_limit: 128m
volumes:
  mysql-data:
  pg-data:
  redis-data:
  es-data:
  grafana-data:
  prom-data:
  app-data:
  npm-cache:
  pgadmin-data:
